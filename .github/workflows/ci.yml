name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (manifest + PKI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run tests
        run: pytest tests -q

  build-default:
    name: Build (development config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          path: "."
          command: idf.py build

  build-secure:
    name: Build (Secure Boot v2 + flash encryption)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build signed firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          path: "."
          command: |
            openssl genrsa -out secure_boot_signing_key.pem 3072
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.secure.defaults" build
